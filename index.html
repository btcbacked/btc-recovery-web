<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="BTCBacked Key Recovery Tool - Recover your Bitcoin signing keys offline" />
    <!--
      PRODUCTION CSP: uncomment and deploy this header via your web server or CDN instead.
      All crypto runs client-side. Only mempool.space is contacted for UTXO queries and broadcasting.

      Content-Security-Policy:
        default-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' https://mempool.space https://*.mempool.space;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'none';
    -->
    <!-- CSP should be deployed as a server header (see comment above), not as a meta tag.
         A meta tag CSP breaks file:// offline usage because 'self' resolves to origin 'null'. -->
    <title>BTCBacked Key Recovery</title>
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding: 2rem;">
        JavaScript is required to run the BTCBacked Key Recovery Tool.
        All cryptographic operations run locally in your browser. Your password and keys are never sent anywhere. The tool only contacts mempool.space, to read the escrow balance and fee rates and to send the payment.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
